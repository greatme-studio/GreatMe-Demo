name: Legacy Demo Preview Probe

on:
  push:
    branches:
      - qa/xcander-legacy-demo-preview-20260915

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser probe
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Probe immutable Vercel Preview
        env:
          TARGET_URL: https://great-me-demo-pod9axrcg-great-me.vercel.app/
        run: |
          node <<'NODE'
          (async () => {
            const { chromium } = require('playwright');
            const target = process.env.TARGET_URL;
            const browser = await chromium.launch({ headless: true });
            const scenarios = [
              { name: 'desktop-enterprise-click', width: 1440, height: 1000, type: 'enterprise', submit: 'click' },
              { name: 'desktop-individual-enter', width: 1440, height: 1000, type: 'individual', submit: 'enter' },
              { name: 'mobile-enterprise-enter', width: 390, height: 844, type: 'enterprise', submit: 'enter' },
              { name: 'mobile-individual-click', width: 390, height: 844, type: 'individual', submit: 'click' },
            ];
            const forbidden = /great[\s_-]*me|遠景|vision\s+international|vision\s+logo|logo\.png/i;
            const results = [];

            async function storageSnapshot(page) {
              return page.evaluate(async () => ({
                localStorage: Object.fromEntries(Object.entries(localStorage)),
                sessionStorage: Object.fromEntries(Object.entries(sessionStorage)),
                indexedDB: typeof indexedDB?.databases === 'function' ? (await indexedDB.databases()).map(x => x.name || '').sort() : [],
                cookie: document.cookie,
                serviceWorkers: 'serviceWorker' in navigator ? (await navigator.serviceWorker.getRegistrations()).map(r => r.scope).sort() : [],
              }));
            }

            for (const scenario of scenarios) {
              const context = await browser.newContext({ viewport: { width: scenario.width, height: scenario.height } });
              const page = await context.newPage();
              const response = await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 60000 });
              if (!response || response.status() !== 200) throw new Error(`${scenario.name}:HTTP_${response?.status()}`);
              await page.waitForSelector('#form form', { timeout: 60000 });
              await page.waitForLoadState('networkidle', { timeout: 60000 }).catch(() => {});

              const title = await page.title();
              if (title !== 'XCANDER｜唯讀展示・3C 資產回收專業評估') throw new Error(`${scenario.name}:TITLE:${title}`);
              let bodyText = await page.locator('body').innerText();
              if (!bodyText.includes('XCANDER') || !bodyText.includes('READ-ONLY DEMO')) throw new Error(`${scenario.name}:XCANDER_BRAND_MISSING`);
              if (!bodyText.includes('此為展示頁，資料不會送出。')) throw new Error(`${scenario.name}:READONLY_NOTICE_MISSING`);
              if (forbidden.test(bodyText)) throw new Error(`${scenario.name}:VISIBLE_LEGACY_BRAND`);
              const html = await page.content();
              if (forbidden.test(html)) throw new Error(`${scenario.name}:HTML_LEGACY_BRAND`);

              const overflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
              if (overflow > 1) throw new Error(`${scenario.name}:HORIZONTAL_OVERFLOW:${overflow}`);

              if (scenario.type === 'individual') {
                await page.getByRole('button', { name: /個人使用者/ }).click();
                await page.waitForSelector('input[name="name"]');
              }

              if (scenario.type === 'enterprise') await page.locator('input[name="company"]').fill('XCANDER QA 測試公司');
              await page.locator('input[name="name"]').fill('QA 測試');
              await page.locator('input[name="phone"]').fill('0900000000');
              await page.locator('input[name="email"]').fill('qa@example.test');
              await page.locator('textarea[name="equipInfo"]').fill('TEST SYNTHETIC — 不送出');

              const beforeStorage = await storageSnapshot(page);
              const beforeUrl = page.url();
              const submitRequests = [];
              let tracking = true;
              page.on('request', req => { if (tracking) submitRequests.push({ method: req.method(), url: req.url(), resourceType: req.resourceType() }); });

              if (scenario.submit === 'click') {
                await page.getByRole('button', { name: /送出報價申請/ }).click();
              } else {
                await page.locator('input[name="email"]').press('Enter');
              }
              await page.getByRole('status').waitFor({ state: 'visible', timeout: 10000 });
              await page.waitForTimeout(800);
              tracking = false;

              const statusText = await page.getByRole('status').innerText();
              if (!statusText.includes('展示操作完成') || !statusText.includes('此為展示頁，資料不會送出。')) throw new Error(`${scenario.name}:SUCCESS_NOTICE_INVALID`);
              if (page.url() !== beforeUrl) throw new Error(`${scenario.name}:NAVIGATED:${page.url()}`);
              if (submitRequests.length !== 0) throw new Error(`${scenario.name}:SUBMIT_NETWORK:${JSON.stringify(submitRequests)}`);

              const afterStorage = await storageSnapshot(page);
              if (JSON.stringify(afterStorage) !== JSON.stringify(beforeStorage)) throw new Error(`${scenario.name}:STORAGE_CHANGED:${JSON.stringify({ beforeStorage, afterStorage })}`);

              bodyText = await page.locator('body').innerText();
              if (forbidden.test(bodyText)) throw new Error(`${scenario.name}:LEGACY_AFTER_SUBMIT`);
              if (!bodyText.includes('XCANDER')) throw new Error(`${scenario.name}:XCANDER_AFTER_SUBMIT_MISSING`);

              results.push({
                scenario: scenario.name,
                viewport: `${scenario.width}x${scenario.height}`,
                userType: scenario.type,
                submit: scenario.submit,
                http: response.status(),
                submitNetworkRequests: submitRequests.length,
                storageChanged: false,
                navigated: false,
                visibleLegacyBrandHits: 0,
                horizontalOverflow: overflow,
                successNotice: true,
              });
              await context.close();
            }

            await browser.close();
            console.log(JSON.stringify({ ok: true, target, scenarios: results }, null, 2));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
