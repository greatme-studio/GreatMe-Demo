name: Legacy Demo Preview Probe

on:
  push:
    branches:
      - qa/xcander-legacy-demo-preview-20260915

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser probe
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Diagnose immutable Vercel Preview
        env:
          TARGET_URL: https://great-me-demo-pod9axrcg-great-me.vercel.app/
        run: |
          node <<'NODE'
          (async () => {
            const { chromium } = require('playwright');
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
            const page = await context.newPage();
            const consoleErrors = [];
            const pageErrors = [];
            const failedRequests = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', err => pageErrors.push(String(err)));
            page.on('requestfailed', req => failedRequests.push({ url: req.url(), error: req.failure()?.errorText || '' }));
            const response = await page.goto(process.env.TARGET_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(12000);
            const diag = await page.evaluate(() => ({
              finalUrl: location.href,
              title: document.title,
              bodyText: document.body?.innerText?.slice(0, 1500) || '',
              rootHtmlLength: document.getElementById('root')?.innerHTML?.length || 0,
              formExists: !!document.querySelector('#form form'),
              scripts: Array.from(document.scripts).map(s => s.src || '[inline]'),
            }));
            console.log(JSON.stringify({ http: response?.status() || null, ...diag, consoleErrors, pageErrors, failedRequests }, null, 2));
            await browser.close();
            if (!response || response.status() !== 200) throw new Error('PREVIEW_HTTP_NOT_200');
            if (!diag.formExists) throw new Error('PREVIEW_FORM_NOT_RENDERED');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
